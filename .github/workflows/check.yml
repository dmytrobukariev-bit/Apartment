name: Проверка жилья

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub иногда запускает с опозданием)
  workflow_dispatch:          # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write

concurrency:
  group: huizen-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Поиск и отправка в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python huizen_bot.py

      - name: Запомнить уже отправленные объявления
        if: always()
        run: |
          git config user.name "huizen-bot"
          git config user.email "huizen-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
