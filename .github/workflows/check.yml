name: Проверка жилья

# Бот работает непрерывно: один запуск длится ~5 ч 40 мин (лимит GitHub 6 ч),
# в конце он сам запускает следующий. Расписание раз в час нужно на случай,
# если цепочка оборвётся.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: huizen-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Бот (поиск + кнопки в Telegram)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "huizen-bot"
          git config user.email "huizen-bot@users.noreply.github.com"
          python huizen_bot.py

      - name: Сохранить состояние, если бот упал
        if: failure()
        run: |
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update bot state" && git pull --rebase -X theirs && git push)
